# Render Blueprint — one Docker web service + a persistent disk for SQLite + images.
# Deploy: push to GitHub, then in Render → New → Blueprint, pick this repo.
# Secrets marked `sync: false` are entered once in the dashboard (never committed).
# NOTE: persistent disks require a paid instance type (Starter+); the free tier
# has an ephemeral filesystem and would wipe your library on each deploy.
services:
  - type: web
    name: writing-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # --- Access control (invite-only) ---
      - key: AUTH_REQUIRED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      # --- Persistent storage (the mounted disk) ---
      - key: DATABASE_PATH
        value: /data/gbedu-desk.sqlite
      - key: IMAGE_DIR
        value: /data/images
      # --- OpenRouter (the only real secret + spend) ---
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MAX_OUTPUT_TOKENS
        value: "4000"
      # --- Per-stage model routing (any OpenRouter slug; edit freely) ---
      - key: MODEL_FRAME
        value: google/gemini-3.5-flash
      - key: MODEL_DRAFT
        value: anthropic/claude-sonnet-4.6
      - key: MODEL_SHARPEN
        value: anthropic/claude-opus-4.8
      - key: MODEL_DISCOVER
        value: google/gemini-3.5-flash
      - key: MODEL_SEO
        value: google/gemini-3.5-flash
      - key: MODEL_REPURPOSE
        value: anthropic/claude-sonnet-4.6
      - key: MODEL_REFINE
        value: anthropic/claude-sonnet-4.6
      - key: MODEL_IMAGE
        value: google/gemini-3-pro-image-preview
      - key: MODEL_SWARM
        value: google/gemini-3.1-flash-lite
      - key: EMBED_MODEL
        value: openai/text-embedding-3-small
      - key: EMBED_DIM
        value: "1536"
      - key: ENABLE_PROMPT_CACHE
        value: "true"
      # --- Fusion (manual Deep Sharpen only by default) ---
      - key: FUSION_STAGES
        value: ""
      - key: FUSION_PANEL
        value: google/gemini-3.1-flash-lite,openai/gpt-5.4-mini
      # --- Web-search plugin defaults (used by The Grid macro stage) ---
      - key: WEB_ENGINE
        value: exa
      - key: WEB_MAX_RESULTS
        value: "6"
